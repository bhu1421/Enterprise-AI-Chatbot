name: Atlas Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-deployment
  cancel-in-progress: false

jobs:
  # 1. Continuous Integration
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python Syntax
        run: python -m compileall -q app worker scripts

  # 2. Continuous Delivery: Docker -> ECR
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Docker image pushed to ECR."

      - name: Keep newest two ECR images
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          command -v jq
          mapfile -t IMAGE_DIGESTS < <(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --output json | jq -r '.imageDetails | sort_by(.imagePushedAt) | reverse | .[].imageDigest'
          )

          if (( ${#IMAGE_DIGESTS[@]} > 2 )); then
            for digest in "${IMAGE_DIGESTS[@]:2}"; do
              aws ecr batch-delete-image \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids "imageDigest=$digest" >/dev/null
              echo "Deleted older ECR image $digest"
            done
          else
            echo "ECR already contains no more than two images."
          fi

  # 3. Continuous Deployment: EC2 self-hosted runner
  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64, atlas-ec2]
    environment: production
    permissions: {}
    steps:
      - name: Check EC2 Prerequisites
        run: |
          set -euo pipefail
          command -v aws
          command -v docker
          command -v curl
          test -r /opt/atlas/.env
          test -d /opt/atlas/hf-cache
          docker info >/dev/null

      - name: Login to ECR and Construct Image URI
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"

          # EC2 uses its instance IAM role; no AWS keys in this deployment job.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Pull Docker Image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Stop Old Container
        run: docker rm -f atlas-enterprise-ai || true

      - name: Start ATLAS Container
        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-ai \
            --restart unless-stopped \
            --env-file /opt/atlas/.env \
            -e HF_HOME=/home/atlas/.cache/huggingface \
            --mount type=bind,src=/opt/atlas/hf-cache,dst=/home/atlas/.cache/huggingface \
            -p 8000:8000 \
            "$IMAGE"

      
      - name: Verify Deployment
        run: |
          set -euo pipefail

          echo "Checking ATLAS Docker container..."

          docker ps -a --filter "name=atlas-enterprise-ai"

          echo "Waiting for FastAPI to become ready..."

          for attempt in $(seq 1 30); do

            if curl -fsS \
              --max-time 10 \
              http://127.0.0.1:8000/health/ready \
              > /dev/null 2>&1; then

              echo "ATLAS deployment successful!"
              exit 0

            fi

            echo "Attempt $attempt/30: Application not ready."
            sleep 5

          done

          echo "Deployment verification failed."

          docker ps -a
          docker logs --tail 100 atlas-enterprise-ai

          exit 1

