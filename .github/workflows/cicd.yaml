
  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64, atlas-ec2]
    environment: production
    permissions: {}

    steps:
      - name: Check EC2 prerequisites
        run: |
          set -euo pipefail
          command -v aws
          command -v docker
          command -v curl
          test -f /opt/atlas/.env
          test -d /opt/atlas/hf-cache
          docker info >/dev/null

      - name: Login to Amazon ECR using EC2 IAM role
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail

          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS \
              --password-stdin "$REGISTRY"

          echo "Amazon ECR login succeeded."

      - name: Pull new Docker image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Stop and remove old container
        run: |
          docker rm -f atlas-enterprise-ai || true

      - name: Start updated container
        run: |
          set -euo pipefail

          docker run -d \
            --name atlas-enterprise-ai \
            --restart unless-stopped \
            --env-file /opt/atlas/.env \
            --add-host host.docker.internal:host-gateway \
            -e OLLAMA_HOST=http://host.docker.internal:11434 \
            -e HF_HOME=/home/atlas/.cache/huggingface \
            --mount type=bind,src=/opt/atlas/hf-cache,dst=/home/atlas/.cache/huggingface \
            -p 8000:8000 \
            "$IMAGE"

      - name: Verify application
        run: |
          set -euo pipefail

          if ! curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            http://127.0.0.1:8000/health/ready > /dev/null; then
            docker logs --tail 100 atlas-enterprise-ai
            exit 1
          fi

          echo "ATLAS application readiness check passed."

      - name: Clean unused Docker images
        run: |
          docker image prune -f
